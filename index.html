<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0c0b">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>KICKSTART</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════
       CSS変数 — 段階ごとに上書きされるテーマ
    ═══════════════════════════════════════════ */
    :root {
      --bg:       #0d0c0b;
      --surface:  #1a1714;
      --border:   #2a2420;
      --accent:   #c44b0a;
      --accent2:  #e06020;
      --glow-col: rgba(196,75,10,0.5);
      --ash:      #8a7a6e;
      --white:    #f0e8e0;
      --green:    #3d9e6a;
      --danger:   #b03010;
      --radius:   14px;
    }

    /* ROUND 2: 加速 */
    .phase-2 {
      --accent:   #e85d04;
      --accent2:  #f48c06;
      --glow-col: rgba(232,93,4,0.65);
      --surface:  #1e1610;
      --border:   #33240f;
    }

    /* ROUND 3: 全力 */
    .phase-3 {
      --accent:   #faa307;
      --accent2:  #ffba08;
      --glow-col: rgba(250,163,7,0.82);
      --surface:  #201800;
      --border:   #3d2e00;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      /* iOSのバウンススクロール防止 */
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      min-height: 100%; min-height: 100dvh;
      background: var(--bg);
      color: var(--white);
      font-family: 'Noto Serif JP', serif;
      overflow-y: auto;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      transition: background 0.9s ease;
      /* iOSセーフエリア対応 */
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* タッチ操作最適化 */
    button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ── Canvas ── */
    #canvas {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
    }

    /* ── ノイズ ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 1;
    }

    #app {
      position: relative; z-index: 2;
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px 0;
    }

    /* ── カード共通 ── */
    .card {
      width: min(460px, 94vw);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 28px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 0 60px var(--glow-col),
        0 24px 60px rgba(0,0,0,0.7);
      position: relative; overflow: hidden;
      transition: background 0.9s, border-color 0.9s, box-shadow 0.9s;
    }

    /* スマホでは上下パディングを詰める */
    @media (max-height: 700px) {
      .card { padding: 24px 22px; }
    }
    .card::after {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      transition: background 0.9s;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .screen.active .card {
      animation: fadeUp 0.36s cubic-bezier(0.22,1,0.36,1) both;
    }

    /* ════════════════════════════
       共通パーツ
    ════════════════════════════ */
    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
      transition: color 0.9s;
    }
    .eyebrow::before {
      content: ''; display: block;
      width: 18px; height: 1px;
      background: var(--accent); transition: background 0.9s;
    }

    .btn-primary {
      display: block; width: 100%;
      padding: 18px 24px;
      /* iOSズーム防止のため16px以上 */
      background: var(--accent); color: #fff;
      border: none; border-radius: 10px;
      font-family: 'Noto Serif JP', serif;
      font-size: 17px; font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 24px var(--glow-col);
      position: relative; overflow: hidden; letter-spacing: 0.04em;
      /* タップターゲット最低44px */
      min-height: 54px;
    }
    .btn-primary::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.14) 0%, transparent 55%);
    }
    @media (hover: hover) {
      .btn-primary:hover { background: var(--accent2); transform: translateY(-2px); box-shadow: 0 8px 32px var(--glow-col); }
    }
    .btn-primary:active { background: var(--accent2); transform: scale(0.98); }

    .btn-done {
      display: block; width: 100%; padding: 16px 16px;
      background: var(--green); color: #fff;
      border: none; border-radius: 9px;
      font-family: 'Noto Serif JP', serif;
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      box-shadow: 0 3px 18px rgba(61,158,106,0.35);
      min-height: 52px;
    }
    @media (hover: hover) { .btn-done:hover { opacity: 0.87; transform: translateY(-1px); } }
    .btn-done:active { opacity: 0.8; transform: scale(0.98); }

    .btn-secondary {
      display: block; width: 100%; padding: 14px 16px;
      background: transparent; color: var(--ash);
      border: 1px solid var(--border); border-radius: 9px;
      font-family: 'Noto Serif JP', serif;
      font-size: 14px; font-weight: 400;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      min-height: 48px;
    }
    @media (hover: hover) { .btn-secondary:hover { border-color: var(--ash); color: var(--white); transform: translateY(-1px); } }
    .btn-secondary:active { border-color: var(--ash); color: var(--white); background: rgba(255,255,255,0.04); }

    .btn-cta {
      display: block; width: 100%; padding: 17px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 9px;
      font-family: 'Noto Serif JP', serif;
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 22px var(--glow-col);
      position: relative; overflow: hidden;
      min-height: 52px;
    }
    .btn-cta::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.14) 0%, transparent 55%);
    }
    @media (hover: hover) { .btn-cta:hover { background: var(--accent2); transform: translateY(-2px); } }
    .btn-cta:active { background: var(--accent2); transform: scale(0.98); }

    /* ════════════════════════════
       スタート画面
    ════════════════════════════ */
    #startScreen h1 {
      font-size: clamp(28px, 7vw, 44px);
      font-weight: 900; line-height: 1.1;
      letter-spacing: -0.025em; margin-bottom: 4px;
    }
    #startScreen h1 .app-name {
      color: var(--accent);
      font-size: clamp(36px, 9vw, 56px);
      display: block;
      transition: color 0.9s;
    }

    #startScreen .tagline {
      font-size: 14px; color: var(--ash);
      margin-bottom: 10px; letter-spacing: 0.01em;
    }

    #startScreen .desc {
      font-size: 13px; line-height: 1.85; color: var(--ash);
      margin-bottom: 28px;
      padding: 12px 14px;
      border-left: 2px solid var(--accent);
      background: rgba(0,0,0,0.2);
      border-radius: 0 6px 6px 0;
      transition: border-color 0.9s;
    }

    .stats-row {
      display: flex; margin-top: 28px;
      padding-top: 22px; border-top: 1px solid var(--border);
      transition: border-color 0.9s;
    }
    .stat { flex: 1; text-align: center; }
    .stat + .stat { border-left: 1px solid var(--border); }
    .stat-num {
      font-family: 'Space Mono', monospace;
      font-size: 20px; font-weight: 700;
      color: var(--accent2); transition: color 0.9s;
    }
    .stat-label { font-size: 10px; color: var(--ash); margin-top: 4px; letter-spacing: 0.06em; }

    /* ════════════════════════════
       タイマー画面
    ════════════════════════════ */
    .phase-banner {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 22px;
    }

    .step-dots { display: flex; gap: 6px; }
    .dot {
      height: 5px; border-radius: 3px;
      background: var(--border);
      transition: background 0.4s, width 0.4s, box-shadow 0.4s; width: 24px;
    }
    .dot.active { width: 34px; background: var(--accent); box-shadow: 0 0 8px var(--glow-col); }
    .dot.done { background: var(--accent2); }

    .phase-tag {
      font-family: 'Space Mono', monospace;
      font-size: 10px; letter-spacing: 0.14em;
      padding: 3px 10px; border-radius: 20px;
      border: 1px solid var(--accent); color: var(--accent);
      transition: border-color 0.9s, color 0.9s;
    }

    .task-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px; letter-spacing: 0.18em;
      color: var(--accent); text-transform: uppercase;
      margin-bottom: 10px; transition: color 0.9s;
    }

    .task-text {
      font-size: clamp(18px, 4.5vw, 23px); font-weight: 700;
      line-height: 1.45; color: var(--white);
      margin-bottom: 8px; min-height: 56px;
      display: flex; align-items: center;
      transition: opacity 0.2s;
    }
    .task-text.fade { opacity: 0; }

    .task-evidence {
      font-size: 12px; line-height: 1.7; color: var(--ash);
      margin-bottom: 14px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.2);
      border-left: 2px solid var(--accent);
      border-radius: 0 6px 6px 0;
      transition: opacity 0.2s, border-color 0.9s;
      min-height: 20px;
    }
    .task-evidence.fade { opacity: 0; }

    /* 入力欄 */
    .note-wrap { margin-bottom: 18px; }
    .note-label { font-size: 12px; color: var(--ash); margin-bottom: 6px; letter-spacing: 0.04em; }
    .note-area {
      width: 100%;
      background: rgba(0,0,0,0.25); border: 1px solid var(--border);
      border-radius: 8px; color: var(--white);
      font-family: 'Noto Serif JP', serif;
      /* iOSの自動ズームを防ぐため16px */
      font-size: 16px; line-height: 1.6;
      padding: 12px 14px; resize: none; outline: none; height: 72px;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    .note-area::placeholder { color: var(--ash); opacity: 0.5; }
    .note-area:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--glow-col); }

    /* タイマーリング — スマホ縦向きに最適化 */
    .timer-wrap {
      display: flex; align-items: center;
      justify-content: center; gap: 20px; margin-bottom: 20px;
    }
    .timer-svg { width: 100px; height: 100px; transform: rotate(-90deg); flex-shrink: 0; }
    .timer-track { fill: none; stroke: var(--border); stroke-width: 5; }
    .timer-ring {
      fill: none; stroke: var(--accent); stroke-width: 5;
      stroke-linecap: round; stroke-dasharray: 376.99; stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.9s;
      filter: drop-shadow(0 0 7px var(--glow-col));
    }
    .timer-ring.urgent { stroke: var(--danger) !important; }

    .timer-info { flex: 1; }
    .timer-num {
      font-family: 'Space Mono', monospace;
      font-size: 38px; font-weight: 700;
      letter-spacing: -0.03em; color: var(--white);
      line-height: 1; display: block; margin-bottom: 4px;
      transition: color 0.3s;
    }
    .timer-num.urgent { color: var(--danger) !important; }
    .timer-sub { font-size: 11px; color: var(--ash); letter-spacing: 0.06em; }

    .btn-group { display: flex; flex-direction: column; gap: 10px; }

    /* ════════════════════════════
       完了画面
    ════════════════════════════ */
    .finish-icon {
      font-size: 52px; text-align: center; margin-bottom: 14px;
      animation: engineRev 1.8s ease-in-out infinite;
    }
    @keyframes engineRev {
      0%,100% { transform: scale(1) rotate(-1deg); }
      40%      { transform: scale(1.1) rotate(1.5deg); }
      70%      { transform: scale(1.06) rotate(-0.5deg); }
    }

    #finishScreen h2 {
      font-size: clamp(24px, 6vw, 32px); font-weight: 900;
      text-align: center; letter-spacing: -0.025em; margin-bottom: 8px;
    }
    #finishScreen h2 span { color: var(--accent); }

    .finish-desc {
      text-align: center; color: var(--ash);
      font-size: 13px; line-height: 1.85; margin-bottom: 26px;
    }

    .history-list { margin-bottom: 24px; display: flex; flex-direction: column; gap: 6px; }
    .history-item {
      display: flex; align-items: flex-start; gap: 10px;
      background: rgba(0,0,0,0.2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px; font-size: 13px;
    }
    .history-step {
      font-family: 'Space Mono', monospace; font-size: 10px;
      color: var(--accent); padding: 2px 7px;
      border: 1px solid var(--accent); border-radius: 10px;
      white-space: nowrap; flex-shrink: 0; margin-top: 1px;
      transition: color 0.9s, border-color 0.9s;
    }
    .history-body { flex: 1; }
    .history-task { color: var(--white); margin-bottom: 3px; }
    .history-note { color: var(--ash); font-size: 12px; font-style: italic; }

    .btn-group-finish { display: flex; flex-direction: column; gap: 8px; }

    /* 段階遷移フラッシュ */
    @keyframes phaseFlash {
      0%   { opacity: 0; }
      15%  { opacity: 0.2; }
      100% { opacity: 0; }
    }
    .phase-flash {
      position: fixed; inset: 0; z-index: 100;
      background: var(--accent); pointer-events: none;
      animation: phaseFlash 0.55s ease-out both;
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="app">

  <!-- ── スタート画面 ── -->
  <div id="startScreen" class="screen active">
    <div class="card">
      <div class="eyebrow">3-minute engine warm-up</div>
      <h1>
        エンジンを<br>かけろ。
        <span class="app-name">KICKSTART</span>
      </h1>
      <p class="tagline">本番前の3分間ルーティン</p>
      <p class="desc">
        脳は「動き出した事実」に反応する。<br>
        小さな行動を1つ完了するだけで<br>
        ドーパミンが出て、次が動きやすくなる。<br>
        これがsmall winの力。<br>
        3分で3つやれば、エンジンはかかってる。
      </p>
      <button class="btn-primary" onclick="startSession()">▶ エンジンスタート</button>
      <div class="stats-row">
        <div class="stat">
          <div class="stat-num" id="totalSessions">0</div>
          <div class="stat-label">起動回数</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="totalTasks">0</div>
          <div class="stat-label">完了タスク</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="streak">0</div>
          <div class="stat-label">連続日数</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── タイマー画面 ── -->
  <div id="timerScreen" class="screen">
    <div class="card">
      <div class="phase-banner">
        <div class="step-dots">
          <div class="dot active" id="dot0"></div>
          <div class="dot"       id="dot1"></div>
          <div class="dot"       id="dot2"></div>
        </div>
        <div class="phase-tag" id="phaseTag">ROUND 1 — ウォームアップ</div>
      </div>

      <div class="task-label" id="taskLabel">まずこれをやる</div>
      <div class="task-text" id="taskText">—</div>
      <div class="task-evidence" id="taskEvidence"></div>

      <div class="note-wrap" id="noteWrap" style="display:none">
        <div class="note-label" id="noteLabel">ここに書いてください</div>
        <textarea class="note-area" id="noteArea" placeholder="なんでも一言でOK"></textarea>
      </div>

      <div class="timer-wrap">
        <svg class="timer-svg" viewBox="0 0 130 130">
          <circle class="timer-track" cx="65" cy="65" r="60"/>
          <circle class="timer-ring"  cx="65" cy="65" r="60" id="timerRing"/>
        </svg>
        <div class="timer-info">
          <span class="timer-num" id="timerNum">03:00</span>
          <span class="timer-sub" id="timerSub">残り時間</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-done"      onclick="handleDone()">✅ 完了した</button>
        <button class="btn-secondary" onclick="handleSkip()">🔄 別のタスクにする</button>
      </div>
    </div>
  </div>

  <!-- ── 完了画面 ── -->
  <div id="finishScreen" class="screen">
    <div class="card">
      <div class="finish-icon">🚀</div>
      <h2>エンジン<span>全開</span></h2>
      <p class="finish-desc">
        3つ動けた。エンジンはもうかかってる。<br>
        本番タスクに今すぐ飛び込もう。
      </p>
      <div class="history-list" id="historyList"></div>
      <div class="btn-group-finish">
        <button class="btn-cta"       onclick="goMain()">🎯 本番タスクを今すぐやる</button>
        <button class="btn-secondary" onclick="startSession()">🔁 もう1セット</button>
        <button class="btn-secondary" onclick="goMain()">✅ 今日はここまで</button>
      </div>
    </div>
  </div>

</div>

<!-- ══════════════════════════════════
     炎パーティクル
══════════════════════════════════ -->
<script>
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const PHASE_CONFIG = [
  { count: 55,  speed: 0.75, size: 2.2, opacity: 0.28, hue: [8, 22] },
  { count: 100, speed: 1.2,  size: 2.8, opacity: 0.42, hue: [15, 32] },
  { count: 160, speed: 1.8,  size: 3.5, opacity: 0.55, hue: [22, 45] },
];

let currentPhaseConfig = PHASE_CONFIG[0];
let particles = [];

class Particle {
  constructor() { this.reset(true); }
  reset(init = false) {
    const c = currentPhaseConfig;
    this.x = Math.random() * canvas.width;
    this.y = init ? Math.random() * canvas.height : canvas.height + 8;
    this.vx = (Math.random() - 0.5) * 0.7;
    this.vy = -(Math.random() * c.speed + 0.35);
    this.life = 0;
    this.maxLife = Math.random() * 180 + 80;
    this.r = Math.random() * c.size + 0.8;
    this.cfg = c;
  }
  update() {
    this.x += this.vx + Math.sin(this.life * 0.05) * 0.35;
    this.y += this.vy;
    this.life++;
    if (this.life >= this.maxLife || this.y < -10) this.reset();
  }
  draw() {
    const t = this.life / this.maxLife;
    const a = (t < 0.2 ? t / 0.2 : 1 - (t - 0.2) / 0.8) * this.cfg.opacity;
    const h = this.cfg.hue[0] + t * (this.cfg.hue[1] - this.cfg.hue[0]);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * (1 - t * 0.4), 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${h},96%,62%,${a})`;
    ctx.fill();
  }
}

function buildParticles() {
  particles = Array.from({ length: currentPhaseConfig.count }, () => new Particle());
}
buildParticles();

function setPhaseParticles(phase) {
  currentPhaseConfig = PHASE_CONFIG[Math.min(phase, 2)];
  while (particles.length < currentPhaseConfig.count) particles.push(new Particle());
}

(function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(loop);
})();
</script>

<!-- ══════════════════════════════════
     アプリロジック
══════════════════════════════════ -->
<script>
const TASKS = {
  /* ── ROUND 1: ウォームアップ（体・感覚系・エビデンスベース） ── */
  easy: [
    { text: "コップ1杯の水を飲む",
      evidence: "軽度の脱水（体重の1〜2%）でも注意力・記憶力が低下することが示されている。水分補給で認知機能を正常に戻せる。",

const PHASE_LABELS = [
  { tag: 'ROUND 1 — ウォームアップ', hint: 'まずこれをやる' },
  { tag: 'ROUND 2 — 加速',           hint: '少し深く入る'   },
  { tag: 'ROUND 3 — 全力',           hint: 'もう動けてる'   },
];
const PHASE_CLASSES = ['', 'phase-2', 'phase-3'];
const PHASE_POOLS   = ['easy', 'medium', 'hard'];

const TOTAL    = 3;
const DURATION = 180;
const circumference = 2 * Math.PI * 60;

let currentTask    = null;
let completedCount = 0;
let timerSeconds   = DURATION;
let timerInterval  = null;
let history        = [];

/* ─── ストレージ ─── */
function loadStats() {
  const s = JSON.parse(localStorage.getItem('spark_stats') || '{}');
  document.getElementById('totalSessions').textContent = s.sessions || 0;
  document.getElementById('totalTasks').textContent    = s.tasks    || 0;
  document.getElementById('streak').textContent        = calcStreak(s);
}

function saveSession() {
  const s = JSON.parse(localStorage.getItem('spark_stats') || '{}');
  s.sessions = (s.sessions || 0) + 1;
  s.tasks    = (s.tasks    || 0) + completedCount;
  s.dates    = s.dates || [];
  const today = new Date().toISOString().slice(0, 10);
  if (!s.dates.includes(today)) s.dates.push(today);
  localStorage.setItem('spark_stats', JSON.stringify(s));
}

function calcStreak(s) {
  if (!s.dates || !s.dates.length) return 0;
  const dates = s.dates.map(d => new Date(d)).sort((a,b) => b-a);
  const today = new Date(); today.setHours(0,0,0,0);
  let streak = 0, cur = today;
  for (const d of dates) {
    const dd = new Date(d); dd.setHours(0,0,0,0);
    if (dd.getTime() === cur.getTime()) { streak++; cur.setDate(cur.getDate()-1); }
    else if (dd < cur) break;
  }
  return streak;
}

/* ─── 画面切替 ─── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ─── フェーズUI ─── */
function applyPhase(phase) {
  document.body.className = PHASE_CLASSES[phase];
  document.getElementById('phaseTag').textContent  = PHASE_LABELS[phase].tag;
  document.getElementById('taskLabel').textContent = PHASE_LABELS[phase].hint;
  setPhaseParticles(phase);
}

function flashTransition() {
  const el = document.createElement('div');
  el.className = 'phase-flash';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 650);
}

/* ─── タスク ─── */
function getRandomTask(phase) {
  const pool = TASKS[PHASE_POOLS[phase]].filter(t => t !== currentTask);
  return pool[Math.floor(Math.random() * pool.length)];
}

function setTask(task) {
  currentTask = task;
  const el  = document.getElementById('taskText');
  const ev  = document.getElementById('taskEvidence');
  el.classList.add('fade');
  ev.classList.add('fade');
  setTimeout(() => {
    el.textContent = `「${task.text}」`;
    el.classList.remove('fade');
    if (task.evidence) {
      ev.textContent = task.evidence;
      ev.style.display = 'block';
    } else {
      ev.style.display = 'none';
    }
    ev.classList.remove('fade');
    const nw = document.getElementById('noteWrap');
    const na = document.getElementById('noteArea');
    const nl = document.getElementById('noteLabel');
    if (task.note) {
      nl.textContent = task.noteLabel || 'ここに書いてください';
      na.value = '';
      nw.style.display = 'block';
    } else {
      nw.style.display = 'none';
    }
  }, 200);
}

/* ─── ドット ─── */
function updateDots() {
  for (let i = 0; i < TOTAL; i++) {
    const dot = document.getElementById(`dot${i}`);
    dot.className = 'dot';
    if (i < completedCount) dot.classList.add('done');
    if (i === completedCount) dot.classList.add('active');
  }
}

/* ─── タイマー ─── */
function updateTimerUI() {
  const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
  const secs = String(timerSeconds % 60).padStart(2, '0');
  const numEl  = document.getElementById('timerNum');
  const ringEl = document.getElementById('timerRing');
  const subEl  = document.getElementById('timerSub');
  numEl.textContent = `${mins}:${secs}`;
  const offset = circumference * (1 - timerSeconds / DURATION);
  ringEl.style.strokeDashoffset = offset;
  const urgent = timerSeconds <= 30;
  numEl.classList.toggle('urgent', urgent);
  ringEl.classList.toggle('urgent', urgent);
  subEl.textContent = urgent ? '⚡ ラストスパート' : '残り時間';
}

function startTimer() {
  clearInterval(timerInterval);
  timerSeconds = DURATION;
  updateTimerUI();
  timerInterval = setInterval(() => {
    if (timerSeconds > 0) { timerSeconds--; updateTimerUI(); }
    else { clearInterval(timerInterval); handleDone(); }
  }, 1000);
}

function stopTimer() { clearInterval(timerInterval); timerInterval = null; }

/* ─── 完了 ─── */
function handleDone() {
  stopTimer();
  const note = document.getElementById('noteArea').value.trim();
  history.push({ task: currentTask, note, phase: completedCount });
  completedCount++;

  if (completedCount >= TOTAL) {
    saveSession();
    renderHistory();
    showScreen('finishScreen');
  } else {
    updateDots();
    flashTransition();
    applyPhase(completedCount);
    setTask(getRandomTask(completedCount));
    startTimer();
  }
}

/* ─── スキップ ─── */
function handleSkip() {
  stopTimer();
  setTask(getRandomTask(completedCount));
  startTimer();
}

/* ─── 履歴 ─── */
function renderHistory() {
  document.getElementById('historyList').innerHTML = history.map(h => {
    const label = PHASE_LABELS[h.phase].tag.split(' — ')[1];
    const noteHtml = h.note ? `<div class="history-note">「${h.note}」</div>` : '';
    return `<div class="history-item">
      <div class="history-step">${label}</div>
      <div class="history-body">
        <div class="history-task">✅ ${h.task.text}</div>
        ${noteHtml}
      </div>
    </div>`;
  }).join('');
}

/* ─── セッション開始 ─── */
function startSession() {
  completedCount = 0; history = []; currentTask = null;
  document.getElementById('noteArea').value = '';
  applyPhase(0);
  updateDots();
  setTask(getRandomTask(0));
  showScreen('timerScreen');
  startTimer();
}

/* ─── トップへ ─── */
function goMain() {
  stopTimer();
  document.body.className = '';
  loadStats();
  showScreen('startScreen');
}

loadStats();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
}
</script>
